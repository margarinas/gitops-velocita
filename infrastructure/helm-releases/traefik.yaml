---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: infrastructure
spec:
  interval: 60m
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: 41.3.0
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 10m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    deployment:
      kind: DaemonSet
    ports:
      git-ssh:
        port: 2222
        expose:
          default: true
        exposedPort: 2222
        protocol: TCP
    service:
      spec:
        externalTrafficPolicy: Local
    ingressRoute:
      dashboard:
        enabled: true
    providers:
      kubernetesIngressNginx:
        enabled: true
