---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocita-news-staging
  namespace: default
  labels:
    app.kubernetes.io/name: velocita-news-staging

spec:
  replicas: 0
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: velocita-news-staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velocita-news-staging
    spec:

      imagePullSecrets:
        - name: regcred

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/server-usage
                    operator: DoesNotExist

      containers:
        - name: velocita-news-staging
          image: "margarinas/velocita-news:latest"
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: velocita-news-staging
            - secretRef:
                name: velocita-news-staging
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /up
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
