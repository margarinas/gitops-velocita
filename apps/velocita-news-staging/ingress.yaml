---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velocita-news-staging
  namespace: default
  labels:
    app.kubernetes.io/name: velocita-news-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "staging-news.motorsniper.lt"
      secretName: tls-velocita-news-staging
  rules:
    - host: "staging-news.motorsniper.lt"
      http:
        paths:
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: velocita-news-staging
                port:
                  number: 8080
