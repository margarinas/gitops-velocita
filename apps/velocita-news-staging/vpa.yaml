apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: velocita-news-staging
  namespace: default
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: velocita-news-staging
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: velocita-news-staging-queue
  namespace: default
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: velocita-news-staging-queue
  updatePolicy:
    updateMode: "Off"
