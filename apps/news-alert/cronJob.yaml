---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: news-alert-cron
  namespace: default
  labels:
    app.kubernetes.io/name: news-alert-cron
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 75
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: news-alert-cron
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: regcred
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.kubernetes.io/server-usage
                        operator: DoesNotExist
          containers:
            - name: news-alert-cron
              image: margarinas/news-alert:latest
              imagePullPolicy: Always
              command:
                - php
                - /var/www/html/artisan
                - schedule:run
              envFrom:
                - configMapRef:
                    name: news-alert
                - secretRef:
                    name: news-alert
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
