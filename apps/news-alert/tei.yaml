---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: news-alert-tei-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-alert-tei
  namespace: default
  labels:
    app.kubernetes.io/name: news-alert-tei
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: news-alert-tei
  template:
    metadata:
      labels:
        app.kubernetes.io/name: news-alert-tei
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/server-usage
                    operator: DoesNotExist
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
          imagePullPolicy: IfNotPresent
          args:
            - --model-id
            - intfloat/multilingual-e5-small
            - --revision
            - 614241f622f53c4eeff9890bdc4f31cfecc418b3
            - --dtype
            - float32
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "4"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: news-alert-tei-data
---
apiVersion: v1
kind: Service
metadata:
  name: news-alert-tei
  namespace: default
  labels:
    app.kubernetes.io/name: news-alert-tei
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: news-alert-tei
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
