---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sports-horizon
  namespace: default
  labels:
    app.kubernetes.io/name: sports-horizon
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: sports-horizon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sports-horizon
    spec:
      imagePullSecrets:
        - name: regcred
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/server-usage
                    operator: DoesNotExist
      containers:
        - name: sports-horizon
          image: margarinas/sports:latest
          imagePullPolicy: Always
          command:
            - php
            - /var/www/html/artisan
            - horizon
          envFrom:
            - configMapRef:
                name: sports
            - secretRef:
                name: sports
            - secretRef:
                name: sports-api-sports
            - secretRef:
                name: sports-ai-providers
          livenessProbe:
            exec:
              command:
                - php
                - /var/www/html/artisan
                - horizon:status
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
