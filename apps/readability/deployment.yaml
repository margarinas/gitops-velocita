---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readability
  namespace: default
  labels:
    app.kubernetes.io/name: readability
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: readability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readability
    spec:
      imagePullSecrets:
        - name: regcred
      tolerations:
        - key: node.kubernetes.io/server-usage
          operator: Equal
          value: readability
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/server-usage
                    operator: In
                    values:
                      - readability
      containers:
        - name: readability

          image: "margarinas/readability:latest"
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: readability

          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              cpu: 3700m
              memory: 7000Mi
