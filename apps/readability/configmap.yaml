---
apiVersion: v1
kind: ConfigMap
metadata:
  name: readability
  namespace: default
  labels:
    app.kubernetes.io/name: readability
data:
  READABILITY_BROWSER_OPERATION_TIMEOUT_MS: "30000"
  # Pages a pooled browser serves before it is recycled. Chrome's memory grows with
  # every page and is only truly reclaimed when the browser process exits, so this is
  # the main defence against OOMKills. The VPA measured ~9GB at the original value of
  # 75 -- more than a cx33 node can give one pod -- and 20 still OOMKilled against the
  # 4Gi limit on real news pages (ads/video are far heavier than the article itself).
  # Costs a browser relaunch (~1-2s) every 5 pages.
  READABILITY_BROWSER_MAX_PAGES: "5"
  # Hard server-side deadline per extraction request. Must stay BELOW the Laravel
  # client timeout in PortalCrawlService::readabilityClient() (35s) so the browser is
  # torn down here rather than abandoned by a client that gave up first.
  READABILITY_REQUEST_DEADLINE_MS: "30000"
