apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: brandwatch
  namespace: default
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brandwatch
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: brandwatch-horizon
  namespace: default
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brandwatch-horizon
  updatePolicy:
    updateMode: "Off"
