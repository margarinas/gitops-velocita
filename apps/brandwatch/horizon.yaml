---
# Horizon master for the `default` queue only.
#
# The `crawl` queue is deliberately NOT served here: this deployment is multi-replica,
# and Horizon's maxProcesses is per-pod, so crawl concurrency could not be bounded.
# Crawl jobs run on the single-replica brandwatch-horizon-crawl deployment instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brandwatch-horizon
  namespace: default
  labels:
    app.kubernetes.io/name: brandwatch-horizon
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: brandwatch-horizon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brandwatch-horizon
    spec:
      imagePullSecrets:
        - name: regcred
      tolerations:
        - key: node.kubernetes.io/server-usage
          operator: Equal
          value: readability
          effect: NoSchedule

      containers:
        - name: brandwatch-horizon

          image: "margarinas/brandwatch:latest"
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - "php artisan horizon --environment=production"
          envFrom:
            - secretRef:
                name: brandwatch
                optional: false
            - configMapRef:
                name: brandwatch
                optional: false
          resources:
            requests:
              # Horizon runs maxProcesses (6) workers, each allowed horizon.defaults
              # memory of 256MB, so the container needs ~1536Mi to hold a full
              # supervisor. The old 1000Mi limit could not, and pods OOMKilled under
              # sustained load. Keep limits >= maxProcesses * horizon memory.
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2000Mi"
              cpu: "2000m"

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "app.kubernetes.io/name"
                    operator: In
                    values:
                      - brandwatch-horizon
              topologyKey: "kubernetes.io/hostname"
