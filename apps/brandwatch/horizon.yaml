---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brandwatch-horizon
  namespace: default
  labels:
    app.kubernetes.io/name: brandwatch-horizon
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: brandwatch-horizon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brandwatch-horizon
    spec:
      imagePullSecrets:
        - name: regcred
      tolerations:
        - key: node.kubernetes.io/server-usage
          operator: Equal
          value: readability
          effect: NoSchedule

      containers:
        - name: brandwatch-horizon

          image: "margarinas/brandwatch:latest"
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - "php artisan horizon"
          envFrom:
            - secretRef:
                name: brandwatch
                optional: false
            - configMapRef:
                name: brandwatch
                optional: false
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1000Mi"
              cpu: "2000m"

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: "app.kubernetes.io/instance"
                    operator: In
                    values:
                      - brandwatch-horizon
              topologyKey: "kubernetes.io/hostname"
