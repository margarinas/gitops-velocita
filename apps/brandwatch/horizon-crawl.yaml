---
# Dedicated Horizon master for the `crawl` queue.
#
# Every crawl job holds a Chrome page open in the readability service, so total crawl
# concurrency must be bounded cluster-wide. Horizon's maxProcesses is per-pod, which
# means this deployment MUST stay at replicas: 1 -- scaling it multiplies the cap in
# config/horizon.php (HORIZON_CRAWL_MAX_PROCESSES) by the replica count and puts the
# readability pods back into browser overload. Scale readability and raise
# HORIZON_CRAWL_MAX_PROCESSES instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brandwatch-horizon-crawl
  namespace: default
  labels:
    app.kubernetes.io/name: brandwatch-horizon-crawl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: brandwatch-horizon-crawl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brandwatch-horizon-crawl
    spec:
      imagePullSecrets:
        - name: regcred
      tolerations:
        - key: node.kubernetes.io/server-usage
          operator: Equal
          value: readability
          effect: NoSchedule

      # Horizon traps SIGTERM and drains in-flight jobs, so this must outlast the
      # longest job. Rotating-proxy portals rotate the exit IP inside the job and get a
      # 120s timeout, so 90s here would SIGKILL them mid-flight on every deploy -- and
      # this deployment uses Recreate, so every deploy terminates the only pod.
      terminationGracePeriodSeconds: 150

      containers:
        - name: brandwatch-horizon-crawl

          image: "margarinas/brandwatch:latest"
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - "php artisan horizon --environment=production-crawl"
          envFrom:
            - secretRef:
                name: brandwatch
                optional: false
            - configMapRef:
                name: brandwatch
                optional: false
          env:
            # ONE concurrent browser job cluster-wide.
            #
            # Measured on the readability pods (3700m CPU limit): delfi.lt takes 16-20s
            # to load even with the pod to itself. Two crawl workers can land on the same
            # readability replica, and the second then queues behind the first for a
            # combined ~40s against the 45s request deadline -- about 5s of margin, which
            # variance eats. At 1 there is no queuing and delfi finishes in 16-20s with
            # ~25s to spare.
            #
            # This costs browser throughput, which is currently free: the crawl queue
            # sits empty and only 14 of 68 portals need a browser at all. Raise it only
            # alongside more readability replicas.
            - name: HORIZON_CRAWL_MAX_PROCESSES
              value: "2"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1000Mi"
              cpu: "1000m"
