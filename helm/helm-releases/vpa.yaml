apiVersion: v1
kind: Namespace
metadata:
  name: vpa-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vertical-pod-autoscaler
  namespace: vpa-system
spec:
  interval: 30m
  chart:
    spec:
      chart: vertical-pod-autoscaler
      version: "0.9.0"
      sourceRef:
        kind: HelmRepository
        name: autoscaler
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    admissionController:
      enabled: false
    updater:
      enabled: false
    recommender:
      enabled: true
      replicas: 1
      podDisruptionBudget:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
