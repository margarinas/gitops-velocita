---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: postgres-pgbouncer-rw
  namespace: default
  labels:
    app.kubernetes.io/name: postgres-pgbouncer-rw
spec:
  cluster:
    name: postgres
  instances: 3
  type: rw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-pgbouncer-rw
    spec:
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - postgres-pgbouncer-rw
              topologyKey: kubernetes.io/hostname
  pgbouncer:
    poolMode: transaction
    parameters:
      default_pool_size: "20"
      max_client_conn: "400"
      max_prepared_statements: "200"
      reserve_pool_size: "5"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pgbouncer-rw
  namespace: default
  labels:
    app.kubernetes.io/name: postgres-pgbouncer-rw
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      cnpg.io/poolerName: postgres-pgbouncer-rw
