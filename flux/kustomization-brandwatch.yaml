apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: brandwatch
  namespace: flux-system
spec:
  dependsOn:
    - name: databases
  interval: 1h0m0s
  path: ./apps/brandwatch
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
