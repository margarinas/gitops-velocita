---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: news-alert
  namespace: flux-system
spec:
  dependsOn:
    - name: databases
    - name: helm
  interval: 1h0m0s
  path: ./apps/news-alert
  prune: true
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
