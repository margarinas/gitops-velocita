apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: helm
  namespace: flux-system
spec:
  interval: 24h0m0s
  path: ./helm
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: vertical-pod-autoscaler
      namespace: vpa-system
  sourceRef:
    kind: GitRepository
    name: flux-system
